services:
  - type: worker
    name: monlua54-obfuscator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "524288"
      - key: BUILD_TIMEOUT_SECONDS
        value: "300"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LUAU_COMPILER
        sync: false
      - key: FIVEM_VALIDATOR
        sync: false
